[package]
name = "karma-lang"
version = "0.3.0"
edition = "2021"
authors = ["Karma Language Project"]
description = "Karma programming language bootstrap compiler with ownership-aware typed interpreter"
license = "MIT"
publish = false

[[bin]]
name = "karma"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
